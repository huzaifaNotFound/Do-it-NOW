<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do It Now</title>
  </head>
  <body class="bg-paper w-full overflow-x-hidden selection:bg-accent selection:text-card">
    <div
      class="relative app-shell mx-auto flex h-dvh overflow-hidden w-full max-w-5xl flex-col items-center gap-5 px-4 py-4 sm:px-6 sm:py-6 lg:h-svh lg:flex-row lg:items-stretch lg:justify-center lg:gap-14 lg:px-8 lg:pb-10 lg:pt-[12svh]"
    >
      <!-- info box -->
      <section class="info-col flex w-full max-w-md shrink-0 flex-col lg:h-full lg:w-70 lg:max-w-none">
        <div class="w-full">
          <h1 id="heading" class="font-display font-extrabold text-[32px] leading-tight text-ink sm:text-[40px]">
            Today
          </h1>
          <p id="date" class="font-sans font-normal text-[13px] text-muted -mt-1 sm:text-[14px]">Monday, November 9</p>

          <!-- progress bar -->
          <div class="w-full bg-chip rounded-full h-1.5 mt-5 sm:mt-6 overflow-hidden">
            <div
              id="progress"
              class="bg-btn h-1.5 rounded-full"
              style="
                width: 0%;
                transition:
                  width 400ms var(--ease-bounce),
                  background-color 0.45s ease;
              "
            ></div>
          </div>

          <p class="font-sans font-normal text-[13px] text-muted mt-2 sm:text-[14px]">
            <span id="completed-todo-count">0</span> of <span id="total-todo-count">0</span> done
          </p>
          <p
            id="status"
            aria-live="polite"
            class="status-line mt-1.5 min-h-4.5 font-sans font-medium text-[13px] text-ok sm:text-[14px]"
          ></p>
        </div>

        <!-- date cardss -->
        <div class="date-block relative mt-6 w-full lg:mt-9">
          <p class="mb-2 font-sans text-[11px] font-semibold uppercase tracking-[0.14em] text-muted select-none">
            Pick a day
          </p>
          <div id="days" class="flex w-full gap-1.5 pt-1 pb-1 overflow-x-auto scrollbar-none"></div>
          <p
            id="back2today"
            class="mx-auto mt-1.5 w-max text-[13px] font-sans font-medium text-accent underline cursor-pointer sm:text-[14px] lg:absolute lg:inset-x-0 lg:top-full lg:mx-auto"
          >
            Back to Today
          </p>
        </div>
      </section>

      <!-- main todo sectn -->
      <main class="main-col min-h-0 flex w-full max-w-md flex-1 flex-col lg:h-full lg:w-130 lg:max-w-none lg:flex-none">
        <p
          class="pb-3 pt-1 font-sans text-[11px] font-semibold uppercase tracking-[0.14em] text-muted select-none lg:pt-0"
        >
          Tasks
        </p>

        <div id="todo-container" class="w-full flex-1 min-h-32 lg:min-h-0 overflow-y-auto overflow-x-hidden"></div>

        <!-- add tasks section -->
        <section class="flex h-20 w-full shrink-0 items-center sm:h-22 lg:h-24">
          <input
            id="input"
            type="text"
            maxlength="27"
            placeholder="Write a task..."
            class="focus:outline-accent flex-1 min-w-0 h-12 rounded-[10px] bg-card p-3 pl-4 font-sans tracking-wide font-medium text-ink disabled:bg-chip/50 disabled:text-muted disabled:placeholder:text-muted disabled:cursor-not-allowed sm:h-13"
          />
          <button
            id="button"
            class="h-12 w-20 shrink-0 font-medium bg-btn rounded-[10px] ml-2 text-card font-sans transition-all duration-200 ease-bounce focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 enabled:cursor-pointer enabled:hover:brightness-125 enabled:active:brightness-90 enabled:active:scale-95 disabled:bg-chip disabled:text-muted disabled:cursor-not-allowed sm:h-13 sm:w-22"
          >
            Add
          </button>
        </section>
      </main>
      <!-- footer -->
      <footer
        class="shrink-0 text-center font-sans text-[12px] text-muted mb-1 select-none sm:absolute sm:inset-x-0 sm:bottom-1.5"
      >
        Made with &#9829; by
        <a
          href="https://github.com/huzaifaNotFound/"
          target="_blank"
          rel="noopener noreferrer"
          class="font-medium text-accent underline underline-offset-2 transition-colors duration-200 hover:text-ink focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 rounded-sm"
          >M. Huzaifa</a
        > &#8226; <a
          href="https://github.com/huzaifaNotFound/todo"
          target="_blank"
          rel="noopener noreferrer"
          class="font-medium text-accent underline underline-offset-2 transition-colors duration-200 hover:text-ink focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 rounded-sm"
          >Source</a
        >
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/date.js"></script>
  </body>
</html>
